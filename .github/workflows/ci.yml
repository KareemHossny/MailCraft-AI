name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Test
        run: npx vitest run --passWithNoTests

  deno:
    name: Deno Edge Function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Edge Function tests
        run: deno test --allow-net --allow-env --no-check supabase/functions

  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: [verify, deno]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        run: |
          supabase functions deploy generate-email --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy ai-content --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy verify-share-password --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy create-payment --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy paymob-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
